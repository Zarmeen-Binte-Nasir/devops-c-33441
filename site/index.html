<!DOCTYPE html>
<html>
<head>
  <title>College Book Catalogue</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      margin: 0;
    }
    header {
      background: #3730a3;
      color: white;
      text-align: center;
      padding: 30px 10px;
    }
    header h1 { margin: 0; }
    header p { margin: 8px 0 0; }
    main {
      max-width: 600px;
      margin: 25px auto;
      padding: 0 15px;
    }
    ul { list-style: none; padding: 0; }
    li {
      background: white;
      margin: 10px 0;
      padding: 14px;
      border-left: 4px solid #3730a3;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <header>
    <h1>College Book Catalogue</h1>
    <p>Seat No: 33441</p>
  </header>
  <main>
    <ul>
      <li>Introduction to Computer Science</li>
      <li>Software Engineering</li>
      <li>Database Systems</li>
      <li>Operating Systems</li>
    </ul>
  </main>
</body>
</html>
